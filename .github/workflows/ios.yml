name: Build IPA

on:
  workflow_call:

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import Code Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: 'FzuHelper.FzuHelper'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      
      - name: Download Widget Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: 'FzuHelper.FzuHelper.widget'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Get commit count
        id: commit_count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Commit count: $COUNT"

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Prebuild
        run: |
          yarn prebuild:ios

      - name: Build
        uses: Apple-Actions/xcodebuild@v1
        with:
          workspace: ios/fzuhelper.xcworkspace
          scheme: fzuhelper
          sdk: iphonesimulator
          build-number: ${{ steps.commit_count.outputs.count }}
          zip-result-bundle: true

      - name: Build Signed
        uses: Apple-Actions/xcodebuild@v1
        with:
          workspace: ios/fzuhelper.xcworkspace
          scheme: fzuhelper
          sdk: iphoneos
          action: archive
          archive-path: fzuhelper.xcarchive
          export-options-plist: fzuhelper.plist
          build-number: ${{ steps.commit_count.outputs.count }}
          zip-result-bundle: true
          zip-archive: true

      - name: Generate Changelog
        id: changelog
        run: |
          GIT_LOG=$(git log -n 3 --pretty=format:"%s" | awk '{print NR ". " $0}') || { echo "Failed to get git log"; exit 1; }
          {
            echo "CHANGELOG<<BSEOF"
            echo -e "同步自 GitHub 最近三条提交记录:\n$GIT_LOG"
            echo "BSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload TestFlight Build

        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: 'fzuhelper.ipa'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ steps.changelog.outputs.CHANGELOG }}
          wait-for-processing: true
