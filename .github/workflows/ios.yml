name: Build IPA

on:
  workflow_call:

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Prebuild
        run: |
          yarn prebuild:ios

      - name: Setup API Key
        run: |
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > AuthKey.p8

      - name: Create Export Options
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/fzuhelper.xcworkspace \
            -scheme fzuhelper \
            -configuration Release \
            -archivePath fzuhelper.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$(pwd)/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            archive | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath fzuhelper.xcarchive \
            -exportPath . \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$(pwd)/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -allowProvisioningUpdates | xcbeautify --renderer github-actions

      - name: Generate Changelog
        id: changelog
        run: |
          GIT_LOG=$(git log -n 3 --pretty=format:"%s" | awk '{print NR ". " $0}') || { echo "Failed to get git log"; exit 1; }
          {
            echo "CHANGELOG<<BSEOF"
            echo -e "同步自 GitHub 最近三条提交记录:\n$GIT_LOG"
            echo "BSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload TestFlight Build
        run: |
          gem install fastlane
          
          cat > key.json << EOF
          {
            "key_id": "${{ secrets.APPSTORE_API_KEY_ID }}",
            "issuer_id": "${{ secrets.APPSTORE_ISSUER_ID }}",
            "key": "$(echo '${{ secrets.APPSTORE_API_PRIVATE_KEY }}' | sed 's/$/\\n/' | tr -d '\n')"
          }
          EOF
          
          fastlane run upload_to_testflight \
            ipa:"fzuhelper.ipa" \
            app_identifier:"FzuHelper.FzuHelper" \
            api_key_path:"key.json" \
            changelog:"${{ steps.changelog.outputs.CHANGELOG }}" \
            distribute_external:true \
            groups:"fzuhelper-refactor,postgraduate" \
            notify_external_testers:true \
            reject_build_waiting_for_review:true \
            skip_waiting_for_build_processing:false
      
      - name: Cleanup
        if: always()
        run: |
          rm -f AuthKey.p8 key.json
