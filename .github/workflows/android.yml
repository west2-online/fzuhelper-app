name: Build APK

on:
  workflow_call:
    outputs:
      artifact-url:
        description: Download URL of the APK artifact
        value: ${{ jobs.build-apk.outputs.artifact-url }}
      version-name:
        description: App version name
        value: ${{ jobs.build-apk.outputs.version-name }}
      version-code:
        description: App version code
        value: ${{ jobs.build-apk.outputs.version-code }}
      changelog:
        description: Recent commit messages
        value: ${{ jobs.build-apk.outputs.changelog }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      version-name: ${{ steps.version-info.outputs.version-name }}
      version-code: ${{ steps.version-info.outputs.version-code }}
      changelog: ${{ steps.version-info.outputs.changelog }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Prebuild
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            export APP_VARIANT=development
          fi
          yarn run prebuild:android

      - name: Build Release APK
        run: |
          cd android
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Keep release-mode PR builds installable without the release keystore.
            export KEYSTORE_PATH=debug.keystore
            export KEYSTORE_PASSWORD=android
            export KEY_ALIAS=androiddebugkey
            export KEY_PASSWORD=android
          else
            echo "$SIGN_KEYSTORE_BASE64" | base64 -d > "./app/$KEYSTORE_PATH"
          fi
          ./gradlew app:packageRelease --no-problems-report \
          -D org.gradle.jvmargs="-Xmx12g -XX:MetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
        env:
          KEYSTORE_PATH: 'keystore.jks'
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}

      - name: Extract Version Info
        id: version-info
        shell: bash
        run: |
          VERSION_CODE=$(grep -m1 'versionCode' android/app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -m1 'versionName' android/app/build.gradle | awk -F '"' '{print $2}')
          CHANGELOG=$(git log -n 3 --pretty=format:"%s" | awk '{print NR ". " $0}')
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<BSEOF"
            echo "$CHANGELOG"
            echo "BSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk artifact/fzuhelper.apk

      - name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: artifact/fzuhelper.apk
          archive: false
          if-no-files-found: error
          retention-days: 0
