name: Main Action

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  android:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  harmony:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/harmony.yml
    secrets: inherit

  alpha:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: android
    uses: ./.github/workflows/alpha.yml
    with:
      version-name: ${{ needs.android.outputs.version-name }}
      version-code: ${{ needs.android.outputs.version-code }}
      changelog: ${{ needs.android.outputs.changelog }}
    secrets: inherit

  beta:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/beta.yml
    secrets: inherit

  version:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/version.yml
    secrets: inherit

  build-report:
    name: Build Report
    # skip fork PRs
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - android
      - ios
      - harmony
    uses: ./.github/workflows/build-report.yml
    with:
      android-result: ${{ needs.android.result }}
      android-url: ${{ needs.android.outputs.artifact-url }}
      ios-result: ${{ needs.ios.result }}
      ios-url: ${{ needs.ios.outputs.artifact-url }}
      harmony-result: ${{ needs.harmony.result }}
      harmony-url: ${{ needs.harmony.outputs.artifact-url }}
