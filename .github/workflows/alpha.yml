name: Publish Alpha

on:
  workflow_call:
    inputs:
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      changelog:
        required: true
        type: string

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: fzuhelper.apk
          path: ${{ github.workspace }}/outputs/

      - name: Extract Version Info
        id: version-info
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          APK_FILENAME="FzuHelper_${VERSION_NAME}.${VERSION_CODE}.apk"
          mv "$GITHUB_WORKSPACE/outputs/fzuhelper.apk" "$APK_FILENAME"
          {
            echo "CHANGELOG<<BSEOF"
            echo "$CHANGELOG"
            echo "BSEOF"
          } >> "$GITHUB_OUTPUT"
          echo "APK_FILENAME=$APK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Delete alpha by GitHub CLI
        run: |
          gh release delete alpha --repo ${{ github.repository }} --cleanup-tag --yes || echo "No alpha release exists."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: alpha
          name: 'Alpha'
          body: |
            ${{ steps.version-info.outputs.CHANGELOG }}

            此版本为新架构测试版，请提前加入内测群 1020036141 了解详情
          prerelease: true
          files: |
            ${{ steps.version-info.outputs.APK_FILENAME }}
